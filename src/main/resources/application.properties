server.port=8080

# Credentials come from environment variables DB_USERNAME / DB_PASSWORD
app.datasource.student.jdbc-url=jdbc:postgresql://localhost:5432/student_db
app.datasource.student.username=${DB_USERNAME:postgres}
app.datasource.student.password=${DB_PASSWORD:postgres}

app.datasource.course.jdbc-url=jdbc:postgresql://localhost:5432/course_db
app.datasource.course.username=${DB_USERNAME:postgres}
app.datasource.course.password=${DB_PASSWORD:postgres}

app.datasource.grade.jdbc-url=jdbc:postgresql://localhost:5432/grade_db
app.datasource.grade.username=${DB_USERNAME:postgres}
app.datasource.grade.password=${DB_PASSWORD:postgres}

# Applied to all three EntityManagerFactories
spring.jpa.properties.hibernate.hbm2ddl.auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
